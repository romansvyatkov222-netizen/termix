name: Release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Smart Rust cache: only dependency artifacts (registry + compiled
      # deps in target/), keyed by Cargo.lock + rustc version. Our own
      # crates are NOT cached (rebuilt each run — that's fast). Replaces
      # the raw actions/cache that also stored target/ but without pruning
      # stale artifacts and without sharing across branch caches.
      # NOTE: do NOT add `src-tauri/target` to any other cache — rust-cache
      # owns that dir and cleans it before save.
      # Placed AFTER the Rust toolchain step (cache key needs rustc version).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Frontend checks
        run: |
          npm ci --allow-scripts=esbuild
          npx tsc --noEmit
          npm run check
          npm run build

      # Full check-suite: fmt + clippy + offline-safe tests.
      # Tag builds (v*) skip clippy/test — main is already green and the
      # installer build below compiles the same graph anyway, so re-running
      # them only burns minutes for zero new signal. Manual runs and
      # non-tag pushes always run the full suite. fmt is cheap, always runs.
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          if ("${{ github.ref_type }}" -ne "tag") {
            cargo clippy --all-targets -- -D warnings
            cargo test sysinfo
          } else {
            echo "tag build: skipping clippy/test (already green on main)"
          }
        shell: pwsh

      # NSIS only: no bare exe is published. The frontend (dist/ built
      # above via beforeBuildCommand) is embedded into the exe as Tauri
      # resources, so the installed app runs with no sources present.
      # Signing env comes from repo secrets (private key never committed).
      - name: Build NSIS installer only
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) must be set, otherwise the
        # bundler fails when createUpdaterArtifacts/pubkey is configured.
        # Fail fast with a clear message instead of a cryptic build error.
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is empty — add the updater private key to repo Settings → Secrets (Actions) and re-run."
          }
          npx tauri build --bundles nsis
        shell: pwsh

      # Tauri names the NSIS bundle as
      # <productName>_<tauri.conf.json version>_<arch>-setup.exe.
      # With createUpdaterArtifacts the bundler also emits the updater
      # bundle (<name>.nsis.zip + .sig). The bundle dir may hold stale
      # files from cache, so resolve by exact versioned name instead of
      # a wildcard.
      - name: Collect installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "Termix_${version}_x64-setup.exe"
          $p = "src-tauri/target/release/bundle/nsis/$name"
          if (-not (Test-Path -LiteralPath $p)) {
            Get-ChildItem src-tauri/target/release/bundle/nsis/ | Format-Table Name, Length
            throw "Expected NSIS bundle not found: $name"
          }
          $f = Get-Item -LiteralPath $p
          $f | Format-Table Name, Length
          "SETUP_PATH=$($f.FullName)" >> $env:GITHUB_ENV
          "SETUP_NAME=$($f.Name)" >> $env:GITHUB_ENV
          # Updater bundle: same basename with .nsis.zip (ci may move this
          # to latest.json generation step below — kept here for clarity).
          $zip = "$p.nsis.zip"
          $sig = "$zip.sig"
          foreach ($u in @($zip, $sig)) {
            if (-not (Test-Path -LiteralPath $u)) {
              Get-ChildItem src-tauri/target/release/bundle/nsis/ | Format-Table Name, Length
              throw "Expected updater artifact not found: $u"
            }
            Get-Item -LiteralPath $u | Format-Table Name, Length
          }
          "UPDATER_ZIP=$zip" >> $env:GITHUB_ENV
          "UPDATER_SIG=$sig" >> $env:GITHUB_ENV

      # Static update manifest consumed by the in-app updater
      # (plugins.updater.endpoints → .../releases/latest/download/latest.json).
      # Shape: { version, notes, pub_date, platforms: { "windows-x86_64": { signature, url } } }.
      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sig = (Get-Content $env:UPDATER_SIG -Raw).Trim()
          $zipName = Split-Path $env:UPDATER_ZIP -Leaf
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = "v$version"
          }
          $manifest = [ordered]@{
            version = $version
            notes = "Termix $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/romansvyatkov222-netizen/termix/releases/download/$tag/$zipName"
              }
            }
          }
          $out = "src-tauri/target/release/bundle/nsis/latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM $out
          Get-Content $out
          "LATEST_JSON=$out" >> $env:GITHUB_ENV

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: termix-installer
          path: |
            ${{ env.SETUP_PATH }}
            ${{ env.UPDATER_ZIP }}
            ${{ env.UPDATER_SIG }}
            ${{ env.LATEST_JSON }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SETUP_PATH }}
            ${{ env.UPDATER_ZIP }}
            ${{ env.UPDATER_SIG }}
            ${{ env.LATEST_JSON }}
          generate_release_notes: true

      - name: Attach to GitHub Release (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          files: |
            ${{ env.SETUP_PATH }}
            ${{ env.UPDATER_ZIP }}
            ${{ env.UPDATER_SIG }}
            ${{ env.LATEST_JSON }}
          generate_release_notes: true
