[package]
name = "termix"
version = "0.1.0"
edition = "2021"

[lib]
name = "termix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "termix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }
russh = { version = "0.54", features = ["rsa", "des", "dsa"] }
russh-sftp = "2.0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
# Optional: Discord Rich Presence logo (reads \\?\pipe\discord-ipc-*).
discord-rich-presence = "1"

# Deliberate: dev builds skip debug symbols for faster Windows linking
# (aws-lc-sys is heavy). Tradeoff: no line info in dev panics/backtraces.
# Remove this section to restore default debugging.
[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
